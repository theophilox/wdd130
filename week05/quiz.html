<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML and CSS Quiz</h1>
    </header>

    <main>
        <form action="HTML and CSS Quiz">
            <div class="quiz">
                <label for="q1">What does the acronym CSS stand for?</label>
                <input type="text" name="q1" id="q1">
            </div>
            <div class="quiz">
                <label for="q2">How are id and class attributes selected in CSS?</label>
                <textarea name="q2" id="q2" cols="20" rows="2"></textarea>
            </div>
            <div class="quiz">
                <label for="q3">Which of the following is a valid CSS comment?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>-----------Select Below-----------</option>
                    <option>// This is a comment</option>
                    <option># This is a comment</option>
                    <option>/* This is a comment */</option>
                </select>
            </div>
            <div class="quiz">
                <label for="q4">What is the bottom margin given this declaration?</label>
                <code>margin: 10px 5px 15px</code>
                <input type="number" name="q4" id="q4">
            </div>
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer></footer>
</body>

</html>
