<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Down the River Rafting</title>
    <meta name="author" content="Nathan Javier">
    <meta name="description" content="Down the river company website to share their services.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header class="flex">
        <img src="images/rafting-logo.png" alt="rafting logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a> </li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="company">

            <h2>Down the River</h2>
            <p>Oarai, Higashiibaraki District, Ibaraki 311-1311</p>
            <p>Ibaraki, Japan</p>
            <p>1234-2321-321</p>
            <p>Email@gmail.com</p>



            <iframe
                src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d23710.615809757426!2d140.5393777630185!3d36.31233706711318!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sriver!5e1!3m2!1sen!2sjp!4v1764599191239!5m2!1sen!2sjp"
                width="600" height="450" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

        <form class="">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
                <label for="email">Email:</label>
                <input type="text" id="email" name="email">
            </div>
            <div>
                <label for="purpose">Message purpose</label>
                <input type="radio" name="inquiry" id="inquiry">
                <label for="inquiry">General Inquiry</label>
                <input type="radio" name="reservation" id="reservation">
                <label for="reservation">Reservation Question</label>
                <input type="radio" name="suggestion" id="suggestion">
                <label for="suggestion">Website Suggestion</label>
            </div>

            <label for="message">Message:</label>
            <textarea name="message" id="message" rows="3" placeholder="Type here....."></textarea>


            <input type="checkbox" id="subscription" name="subscription">
            <label for="subscription">Please subscribe me to the monthly newsletter</label>

            <button type="submit">Get in touch</button>


        </form>

    </main>

    <footer>
        <div class="end">
            <p>Copyright © 2025 🌊 Down the River | Nathan Javier</p>
            <nav class="socialmedia">
                <a href="www.facebook.com">
                    <img src="images/facebook.png" alt="facebook social" />
                </a>

                <a href="www.instagram.com">
                    <img src="images/instagram.png" alt="instagram social" />
                </a>

                <a href="www.youtube.com">
                    <img src="images/youtube.png" alt="youtube social" />
                </a>
            </nav>
        </div>
    </footer>

</body>

</html>
