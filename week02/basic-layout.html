<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A basic HTML structure example using semantic html elements.">
    <meta name="author" content="Nathan Javier">
    <title>Basic HTML Structure</title>
</head>

<body>
    <header>
        <img src="./images/basic-logo.png" alt="basic logo" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li><a href="https://www.churchofjesuschrist.org/welcome/savior-jesus-christ?lang=eng">Jesus is your
                    savior</a> </li>
            <li> <a href="https://www.churchofjesuschrist.org/welcome/life-has-purpose?lang=eng">Your life has a purpose
                    and meaning</a> </li>
        </ul>
    </nav>

    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2> First Section</h2>
            <p> This is the first section</p>
        </section>

        <section>
            <h2> Second Section</h2>
            <p> This is the second section</p>
        </section>

        <aside>
            <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/albuquerque-new-mexico/800x500/albuquerque-temple-lds-998219-wallpaper.jpg"
                width="200">
        </aside>
    </main>

    <footer>
        <p>Nathan Javier</p>
    </footer>
</body>

</html>
